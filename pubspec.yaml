name: brandguard_flutter
description: >-
  Catch white-label mistakes before release. Validates Flutter brand assets,
  application IDs, app names, ARB translations, and production URLs.
version: 0.1.0
# repository: Set this once a real public repository exists.

topics:
  - flutter
  - white-label
  - cli
  - validation
  - ci

environment:
  sdk: ^3.8.0

dependencies:
  args: ^2.7.0
  path: ^1.9.0
  yaml: ^3.1.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0

executables:
  brandguard: brandguard
